name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nix:
    name: flake check, manifest sync, home seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: nix flake check
        run: nix flake check --no-build -L

      - name: manifest.json matches Nix
        run: |
          nix build .#qubix-manifest-json --out-link manifest.generated
          if ! diff -u manifest.json manifest.generated; then
            echo "::error::manifest.json is stale. Run tools/update-manifest.sh and commit the result."
            exit 1
          fi

      - name: home seed image builds
        run: nix build .#spotibox-home-vhdx -L --no-link

  closure:
    name: production closure budget
    runs-on: ubuntu-latest
    env:
      # For the push step's condition: `if:` cannot read secrets directly.
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The production closure and the things it is built from do not fit
        # next to the runner's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main

      # Pull only.  The cache is public, and the action's own push sends
      # whole closures - the toplevel's has Spotify in it, which nixpkgs marks
      # unfree and not redistributable.  What is worth caching is pushed by
      # name after the build.
      - uses: cachix/cachix-action@v17
        with:
          name: physshell
          skipPush: true

      # Builds system.build.toplevel - the closure the VHDX is made of - and
      # compares it against tests/closure-budget.nix.  No KVM needed: the disk
      # image is not built here, only the system that goes into it.
      - name: Closure budget
        run: tools/closure.sh check

      # The appliance kernel is the one expensive thing in that build - about
      # 26 minutes on a runner - and 25 MiB to download.  The toplevel and the
      # image take its out and modules outputs, and neither refers to anything
      # else; dev would drag 2.6 GiB of toolchain along, and nothing needs it.
      # Skipped wherever the token is not there, forks included.
      - name: Push the appliance kernel to the binary cache
        if: env.CACHIX_AUTH_TOKEN != ''
        run: |
          kernel='.#nixosConfigurations.spotibox.config.boot.kernelPackages.kernel'
          cachix push physshell \
            "$(nix eval --raw "$kernel.outPath")" \
            "$(nix eval --raw "$kernel.modules.outPath")"

  powershell:
    name: controller lint + unit checks (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Windows PowerShell 5.1 is what qubix-up.cmd runs; pwsh is the
        # developer console.  Both must stay happy.
        shell: [powershell, pwsh]
    defaults:
      run:
        # A step's own `shell:` accepts no contexts at all, so the matrix
        # value has to arrive through the job defaults instead.
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path tools -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize | Out-String | Write-Host
          if ($results.Count -gt 0) { exit 1 }

      - name: unit checks
        # A suite that passes never calls exit, so $LASTEXITCODE keeps
        # whatever it held before - nothing, in a fresh shell, and
        # `$null -ne 0` is true: the old per-suite check ran `exit $null`,
        # which is exit 0, after the first suite and skipped the rest.
        # Hence a reset before each one.
        run: |
          foreach ($suite in './tests/qubixctl.Tests.ps1', './tests/qubix-acceptance.Tests.ps1') {
            $global:LASTEXITCODE = 0
            & $suite
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
